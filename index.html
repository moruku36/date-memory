<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#ff758c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <title>デートのメモリー</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar" aria-label="アルバム操作">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="kicker">Private Album</p>
            <h1>デートのメモリー</h1>
          </div>
        </div>

        <div class="top-actions">
          <button class="icon-button" id="bgmToggle" type="button" aria-label="BGM再生" title="BGM再生">
            <svg class="bgm-off-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
              <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
            </svg>
            <svg class="bgm-on-icon" aria-hidden="true" viewBox="0 0 24 24" hidden>
              <path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
            </svg>
          </button>
          <button class="icon-button" id="fullscreenToggle" type="button" aria-label="シアターモード" title="全画面シアター">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
          <label class="button primary" for="photoInput">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            写真を選ぶ
          </label>
          <input id="photoInput" type="file" accept="image/*,.heic,.heif" multiple>
          <button class="icon-button" id="themeToggle" type="button" aria-label="テーマ切替" title="テーマ切替">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3a9 9 0 1 0 9 9 6.5 6.5 0 0 1-9-9Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- ✨ 過去の今日の思い出バナー -->
      <aside class="on-this-day-banner" id="onThisDayBanner" hidden>
        <div class="on-this-day-content">
          <span class="sparkle-icon">✨</span>
          <div>
            <strong>過去の今日の思い出</strong>
            <p id="onThisDaySubtitle">1年前の今日撮影された写真があります</p>
          </div>
        </div>
        <button class="button compact glass" id="playOnThisDayBtn" type="button">再生する</button>
      </aside>

      <main class="workspace">
        <section class="memory-stage" id="memoryStage" aria-label="メモリー再生">
          <div class="stage-bg" id="stageBg"></div>
          <div class="stage-sheen" aria-hidden="true"></div>

          <div class="empty-panel" id="emptyPanel">
            <div class="empty-collage" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <h2>写真を重ねると、思い出が動き出します。</h2>
            <label class="button primary large" for="photoInput">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              写真を選ぶ
            </label>
          </div>

          <article class="hero-photo" id="heroPhoto" hidden>
            <div class="hero-image-wrapper" id="heroImageWrapper">
              <img id="currentPhoto" alt="" decoding="async" fetchpriority="high">
              
              <!-- 写真上のクイックアクションボタン -->
              <div class="photo-overlay-actions">
                <button class="overlay-button" id="favoriteBtn" type="button" aria-label="お気に入り" title="お気に入り">
                  <svg class="heart-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                  </svg>
                </button>
                <button class="overlay-button" id="zoomBtn" type="button" aria-label="拡大" title="拡大プレビュー">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                  </svg>
                </button>
              </div>
            </div>

            <div class="photo-caption">
              <div class="caption-header">
                <div>
                  <p id="memoryDate">Memory</p>
                  <h2 id="memoryTitle">デートのメモリー</h2>
                </div>
                <span id="memoryCounter">1 / 1</span>
              </div>

              <!-- 💬 写真メモ・コメントエリア -->
              <div class="photo-memo-container" id="photoMemoContainer">
                <p class="photo-memo-text" id="photoMemoText">💬 メモを追加...</p>
                <input class="photo-memo-input" id="photoMemoInput" type="text" placeholder="思い出のメモ・感想・場所を入力..." maxlength="200" hidden>
              </div>
            </div>
          </article>

          <div class="stage-controls" id="stageControls" hidden>
            <button class="icon-button glass" id="prevBtn" type="button" aria-label="前の写真" title="前の写真">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button class="play-button" id="playBtn" type="button" aria-label="再生" title="再生">
              <svg class="play-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7Z"></path>
              </svg>
              <svg class="pause-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 5v14M16 5v14"></path>
              </svg>
            </button>
            <button class="icon-button glass" id="nextBtn" type="button" aria-label="次の写真" title="次の写真">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>
        </section>

        <aside class="side-panel" aria-label="コレクション">
          <div class="panel-section compact">
            <label class="field-label" for="albumName">メモリー名</label>
            <input id="albumName" class="text-field" type="text" value="デートのメモリー">
          </div>

          <div class="panel-section">
            <div class="section-head">
              <h2>コレクション</h2>
              <span id="photoCount">0枚</span>
            </div>
            <div class="collection-list" id="collectionList"></div>
          </div>

          <div class="panel-section">
            <div class="section-head">
              <h2>ムード & エフェクト</h2>
            </div>
            <div class="segmented" role="group" aria-label="ムード">
              <button class="segment active" data-mood="cinema" type="button">Cinema</button>
              <button class="segment" data-mood="kenburns" type="button">Ken Burns</button>
              <button class="segment" data-mood="day" type="button">Day</button>
              <button class="segment" data-mood="night" type="button">Night</button>
            </div>
          </div>

          <div class="panel-section">
            <div class="section-head">
              <h2>再生速度</h2>
              <span id="speedValue">4秒</span>
            </div>
            <input id="speedRange" class="range" type="range" min="2" max="8" step="1" value="4" aria-label="再生速度">
          </div>

          <div class="panel-section">
            <div class="section-head">
              <h2>データ & 保存</h2>
            </div>
            <div class="share-actions">
              <button class="button primary compact" id="zipExportBtn" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
                </svg>
                写真の一括保存(ZIP)
              </button>
              <button class="button quiet compact" id="exportBtn" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 3v12M8 11l4 4 4-4M5 21h14"></path>
                </svg>
                JSON書出
              </button>
              <label class="button quiet compact" for="albumImportInput">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 21V9M8 13l4-4 4 4M5 3h14"></path>
                </svg>
                JSON読込
              </label>
              <input id="albumImportInput" type="file" accept="application/json,.json">
            </div>
            <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
          </div>
        </aside>

        <section class="library" aria-label="写真一覧">
          <div class="library-head">
            <div>
              <p class="kicker">Gallery</p>
              <h2>写真一覧</h2>
            </div>
            <div class="library-actions">
              <div class="selection-actions" id="selectionActions" hidden>
                <span id="selectionCount">0枚選択中</span>
                <button class="button danger compact" id="deleteSelectedBtn" type="button" disabled>
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"></path>
                  </svg>
                  削除
                </button>
              </div>
              <button class="button quiet compact" id="selectModeBtn" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span id="selectModeLabel">選択</span>
              </button>
              <div class="view-toggle" role="group" aria-label="表示切替">
                <button class="icon-button active" data-view="mosaic" type="button" aria-label="モザイク表示" title="モザイク表示">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4 4h7v7H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 13h7v7H4z"></path>
                  </svg>
                </button>
                <button class="icon-button" data-view="strip" type="button" aria-label="フィルム表示" title="フィルム表示">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4 7h16v10H4zM8 7v10M16 7v10"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="drop-zone" id="dropZone">
            <div class="thumb-grid mosaic" id="thumbGrid"></div>
          </div>
        </section>
      </main>

      <!-- ⏳ アップロード進捗モーダル -->
      <div class="progress-modal" id="uploadProgressModal" hidden>
        <div class="progress-card">
          <div class="progress-spinner"></div>
          <h3 id="progressTitle">写真を処理中...</h3>
          <p id="progressSubtitle">1 / 1枚をアップロード中</p>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- 🔍 Lightbox ズームプレビューモーダル -->
      <div class="lightbox-modal" id="lightboxModal" hidden>
        <button class="icon-button glass lightbox-close" id="lightboxCloseBtn" type="button" aria-label="閉じる">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
        <div class="lightbox-content" id="lightboxContent">
          <img id="lightboxImg" alt="" decoding="async">
        </div>
        <p class="lightbox-hint">ピンチまたはダブルタップでズーム</p>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
